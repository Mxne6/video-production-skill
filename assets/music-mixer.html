<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声音工作台</title>
<style>
:root{--bg:#eeede8;--paper:#faf9f5;--ink:#242721;--muted:#808278;--line:#deded4;--accent:#ce5b30;--dark:#20251f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}header{max-width:1240px;margin:auto;padding:28px 36px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:2px}.logo{width:28px;height:28px;display:flex;align-items:center;gap:3px}.logo i{display:block;width:4px;background:var(--accent);height:12px;border-radius:2px}.logo i:nth-child(2){height:25px}.logo i:nth-child(3){height:18px}.logo i:nth-child(4){height:9px}.header-note{color:var(--muted);font-size:12px}main{max-width:1240px;margin:0 auto;padding:32px 36px 24px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--accent);font-weight:700}.intro h1{font-size:32px;font-weight:500;letter-spacing:-1px;line-height:1.3;margin:8px 0}.intro p{color:var(--muted);margin:0;font-size:13px}.badge{font-size:11px;white-space:nowrap;border:1px solid var(--line);border-radius:30px;padding:6px 12px;color:#6d7469}.badge:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px}.workspace{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(340px,.94fr);background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px #34372708}.screen{background:var(--dark);padding:22px 28px 20px;position:relative;color:#f6f5ef}.screen-top{display:flex;justify-content:space-between;color:#b0b6a9;font-size:10px;letter-spacing:1.7px;margin-bottom:16px}.stage{height:440px;display:flex;align-items:center;justify-content:center;position:relative}.stage video{max-width:100%;height:100%;object-fit:contain;position:relative;z-index:1;border-radius:5px;box-shadow:0 8px 26px #0004}.stage video:not([src]):not([poster]){display:none}.empty{position:absolute;text-align:center;color:#abb2a5}.empty svg{width:64px;height:64px;stroke:#bfc8b8;fill:none;stroke-width:1.2;margin-bottom:14px}.empty strong{display:block;font-weight:400;font-size:17px}.empty p{font-size:12px;max-width:260px}.screen-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.project-title{font-size:12px;color:#d8dcd2;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.screen-foot span:last-child{font:11px 'Consolas',monospace;color:#8f9988}.desk{padding:30px 34px 24px;display:flex;flex-direction:column}.section-label{font-size:10px;letter-spacing:1.7px;color:var(--muted)}.desk h2{font-size:24px;letter-spacing:-.5px;font-weight:500;margin:10px 0 6px}.subtext{font-size:12px;color:var(--muted);margin:0}.gain-readout{display:flex;align-items:baseline;gap:10px;margin:30px 0 4px}.gain-readout strong{font:300 76px/1.1 'Bahnschrift','Consolas',sans-serif;letter-spacing:-4px}.gain-readout span{font:16px 'Consolas',monospace;color:var(--muted)}.gain-row{display:flex;align-items:center;gap:14px}.step{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#73796c;font-size:20px;flex-shrink:0}.step:hover{background:#eeeee5}input[type=range]{--fill:50%;appearance:none;height:4px;border-radius:5px;background:linear-gradient(to right,var(--accent) var(--fill),#dedfd5 var(--fill));width:100%;margin:24px 0;cursor:pointer;accent-color:var(--accent)}input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;background:var(--paper);border:4px solid var(--accent);border-radius:50%;box-shadow:0 0 0 4px #ce5b3010}input[type=range]::-moz-range-thumb{width:10px;height:10px;border:3px solid var(--accent);background:var(--paper);border-radius:50%}.range-labels{display:flex;justify-content:space-between;font:10px 'Consolas',monospace;color:var(--muted);padding:0 48px}.presets{display:flex;gap:8px;margin:22px 0 26px;flex-wrap:wrap}.preset{background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 13px;font-size:11px;color:#71766b}.preset.active{background:#f6e9df;border-color:#dcba9e;color:#ac4d25}.voice-note{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 0;font-size:12px}.voice-note small{color:var(--muted);font-size:11px}.voice-note b{font-weight:400;color:#5d6b51}.actions{margin-top:auto;padding-top:27px;display:flex;gap:10px}.primary{flex:1;border:0;border-radius:7px;background:var(--dark);color:#f8f7ef;padding:13px 18px;font-size:13px}.secondary{border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--ink);padding:10px 15px;font-size:12px}.primary:hover{background:#363e30}.hint{font-size:11px;color:var(--muted);margin:12px 0 0;min-height:18px}.transport{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-top:16px;display:grid;grid-template-columns:100px 1fr 110px;align-items:center;gap:22px}#play{background:var(--dark);color:white;border:0;padding:10px 12px;border-radius:7px;font-size:12px}.timeline{position:relative;height:44px}.timeline canvas{width:100%;height:36px;display:block}.timeline input{position:absolute;left:0;bottom:0;margin:0;height:3px}#time{font:11px 'Consolas',monospace;color:#7b8074;text-align:right}footer{margin-top:18px;display:flex;justify-content:space-between;color:#8b8f83;font-size:10px;letter-spacing:.3px}#error{color:#a34729;font-size:12px;white-space:pre-wrap}#retry{margin-top:8px}body[data-loading=true] .badge:before{animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.3}}@media(max-width:760px){header{padding:20px}.header-note{display:none}main{padding:24px 16px}.intro{align-items:start;gap:15px}.intro h1{font-size:26px}.workspace{grid-template-columns:1fr}.stage{height:360px}.desk{padding:24px}.gain-readout{margin-top:20px}.gain-readout strong{font-size:64px}.transport{grid-template-columns:78px 1fr;gap:14px;padding:15px}#time{grid-column:2}.intro p{max-width:240px}.badge{margin-top:5px}.actions{padding-top:22px}footer{gap:20px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><div class="brand"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>SOUND / STUDIO</div><div class="header-note">视频制作 · 声音工作台</div></header>
<main><div class="intro"><div><div class="eyebrow">THE FINAL TOUCH</div><h1>让声音，恰到好处。</h1><p>一边看，一边听，找到音乐与讲述的平衡。</p></div><div class="badge" id="status" role="status">准备试听</div></div>
<div class="workspace"><section class="screen"><div class="screen-top"><span>VIDEO PREVIEW</span><span id="format">预览画面</span></div><div class="stage"><div class="empty" id="empty"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="5" width="40" height="54" rx="5"/><path d="m27 23 13 9-13 9z"/></svg><strong>你的下一支作品</strong><p id="empty-note">绑定视频后，画面会显示在这里。</p></div><video id="video" muted playsinline preload="metadata"></video></div><div class="screen-foot"><span class="project-title" id="project">视频调音模板</span><span>PICTURE + SOUND</span></div></section>
<section class="desk"><div class="section-label">01 / BACKGROUND MUSIC</div><h2>背景音乐</h2><p class="subtext">保留讲述的清晰，也让音乐有存在感。</p><div class="gain-readout"><strong id="level">+0.0</strong><span>dB</span></div><div class="gain-row"><button class="step" id="minus" aria-label="降低半分贝">−</button><input id="gain" aria-label="背景音乐音量" type="range" min="-18" max="8" step=".5" value="0"><button class="step" id="plus" aria-label="提高半分贝">+</button></div><div class="range-labels"><span>−18 dB</span><span>0</span><span>+8 dB</span></div><div class="presets"><button class="preset" data-offset="-6">轻柔 −6</button><button class="preset" data-offset="0">基准 0</button><button class="preset" data-offset="5">明显 +5</button><button class="preset" id="reset">恢复当前设置</button></div><div class="voice-note"><span>旁白音量 <small>保持原声</small></span><b>0 dB</b></div><div id="error" role="alert"></div><button id="retry" class="secondary" hidden>重新加载</button><div class="actions"><button id="copy" class="primary">复制音量设置</button><button id="compare" class="secondary" aria-pressed="false">只听旁白</button></div><p class="hint" id="hint" aria-live="polite">调好后复制设置，发给我即可用于导出。</p></section></div>
<div class="transport"><button id="play" disabled>准备中</button><div class="timeline"><canvas id="wave" aria-label="旁白波形"></canvas><input id="seek" aria-label="播放位置" type="range" min="0" max="1" step=".01" value="0" disabled></div><span id="time">00:00 / 00:00</span></div><footer><span>声音先行，音乐相伴。</span><span>试听调整不覆盖已导出的视频</span></footer></main>
<script type="application/json" id="mix-data">/*MIX_DATA*/</script>
<script>
const $=s=>document.querySelector(s),video=$('#video'),play=$('#play'),seek=$('#seek'),gain=$('#gain'),level=$('#level'),clock=$('#time'),error=$('#error'),statusLabel=$('#status');
let D=null,ctx=null,musicGain=null,buffers=[],sources=[],playing=false,position=0,origin=0,duration=0,busy=false,operation=0,voiceOnly=false,loadController=null,videoUrl=null;
function showStatus(text){statusLabel.textContent=text}function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function now(){return playing?Math.min(duration,Math.max(0,ctx.currentTime-origin)):position}
function paintRange(el){el.style.setProperty('--fill',((el.value-el.min)/(el.max-el.min)*100)+'%')}
function changeGain(){const value=Number(gain.value);level.textContent=(value>=0?'+':'')+value.toFixed(1);paintRange(gain);document.querySelectorAll('[data-offset]').forEach(b=>b.classList.toggle('active',Number(b.dataset.offset)===value));if(ctx&&musicGain){const desired=10**(value/20),headroom=Math.min(1,(.98-D.voicePeak)/Math.max(D.basePeak*desired,1e-9));musicGain.gain.setValueAtTime(voiceOnly?0:desired*headroom,ctx.currentTime)}}
function stop(){operation++;busy=false;position=now();playing=false;for(const s of sources){try{s.stop()}catch{}s.disconnect()}sources=[];video.pause();play.textContent='播放';if(buffers.length)showStatus('已暂停')}
async function start(){if(busy||playing||buffers.length!==2)return;busy=true;const ticket=++operation;try{await ctx.resume();if(ticket!==operation)return;if(position>=duration)position=0;video.currentTime=position;await video.play();if(ticket!==operation)return;origin=ctx.currentTime+.08-position;sources=buffers.map((b,i)=>{const s=ctx.createBufferSource();s.buffer=b;s.connect(i?musicGain:ctx.destination);s.start(origin+position,position);return s});playing=true;play.textContent='暂停';showStatus('正在试听')}catch(e){if(ticket===operation){stop();error.textContent='播放未能开始：'+e.message;showStatus('播放失败')}}finally{if(ticket===operation)busy=false}}
function drawWave(){const canvas=$('#wave'),rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=36*dpr;const g=canvas.getContext('2d');g.scale(dpr,dpr);g.strokeStyle='#e2e3d9';g.beginPath();g.moveTo(0,18);g.lineTo(rect.width,18);g.stroke();if(!buffers.length)return;const samples=buffers[0].getChannelData(0),count=Math.floor(rect.width/4),step=Math.max(1,Math.floor(samples.length/count));g.fillStyle='#a7af9c';for(let i=0;i<count;i++){let peak=0;for(let j=i*step;j<Math.min(samples.length,(i+1)*step);j+=32)peak=Math.max(peak,Math.abs(samples[j]));const h=Math.max(2,Math.min(32,peak*160));g.fillRect(i*4,18-h/2,2,h)}}
function tick(){if(playing){const t=now();if(t>=duration){stop();showStatus('试听结束')}else if(video.readyState>=2&&Math.abs(video.currentTime-t)>.08)video.currentTime=t;}seek.value=now();paintRange(seek);clock.textContent=fmt(now())+' / '+fmt(duration);requestAnimationFrame(tick)}
async function load(){if(!D)return;stop();buffers=[];play.disabled=true;seek.disabled=true;play.textContent='加载中';error.textContent='';$('#retry').hidden=true;showStatus('正在加载素材');document.body.dataset.loading='true';if(loadController)loadController.abort();const controller=new AbortController();loadController=controller;const timeout=setTimeout(()=>controller.abort(),25000);try{if(!ctx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('当前浏览器不支持调音，请在 Chrome 中打开');ctx=new Audio();musicGain=ctx.createGain();musicGain.connect(ctx.destination);ctx.onstatechange=()=>{if(ctx.state!=='running'&&playing)stop()}}changeGain();const fetchData=async url=>{const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error('素材无法读取（'+r.status+'）');return r};const results=await Promise.all([fetchData(D.video).then(async r=>{const blob=await r.blob();if(videoUrl)URL.revokeObjectURL(videoUrl);await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(Error('视频无法解码'));controller.signal.addEventListener('abort',()=>reject(Error('加载超时')),{once:true});videoUrl=URL.createObjectURL(blob);video.src=videoUrl;video.load()});}),...[D.voice,D.music].map(async url=>ctx.decodeAudioData(await (await fetchData(url)).arrayBuffer()))]);buffers=results.slice(1);duration=buffers[0].duration;if(Math.abs(buffers[1].duration-duration)>.05)throw Error('声音时长不一致，需要重新生成试听页');seek.max=duration;seek.disabled=false;play.disabled=false;play.textContent='播放';$('#empty').hidden=true;showStatus('可以试听');drawWave()}catch(e){buffers=[];play.textContent='加载失败';showStatus('素材未就绪');error.textContent=(location.protocol==='file:'?'请通过项目预览链接打开，此浏览器无法直接读取本地音轨。':e.name==='AbortError'?'素材加载超时，请检查本地预览服务后重试。':e.message);$('#retry').hidden=false}finally{clearTimeout(timeout);document.body.dataset.loading='false'}}
play.onclick=()=>playing||busy?stop():start();seek.oninput=()=>{const resume=playing||busy;stop();position=Number(seek.value);video.currentTime=position;if(resume)start()};gain.oninput=changeGain;
for(const [id,delta] of [['minus',-.5],['plus',.5]])$('#'+id).onclick=()=>{gain.value=Math.max(-18,Math.min(8,Number(gain.value)+delta));changeGain()};document.querySelectorAll('[data-offset]').forEach(b=>b.onclick=()=>{gain.value=b.dataset.offset;changeGain()});$('#reset').onclick=()=>{gain.value=D?D.offset:0;changeGain()};$('#compare').onclick=()=>{voiceOnly=!voiceOnly;$('#compare').textContent=voiceOnly?'恢复背景音乐':'只听旁白';$('#compare').setAttribute('aria-pressed',String(voiceOnly));changeGain()};$('#copy').onclick=async()=>{const text='背景音乐音量：'+level.textContent+' dB'+(D?'（基础避让 '+D.gap+' dB）':'');try{await navigator.clipboard.writeText(text);$('#hint').textContent='已复制。将这段设置发给我即可。'}catch{$('#hint').textContent=text+'，请复制这行文字。'}};$('#retry').onclick=load;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(playing||busy))stop()});window.addEventListener('resize',drawWave);
try{D=JSON.parse($('#mix-data').textContent);if(!D||!D.video||!D.voice||!D.music)throw Error('missing data')}catch{D=null}
if(D){gain.value=D.offset;duration=D.duration||0;$('#project').textContent=D.title||'当前视频';$('#format').textContent=D.width&&D.height?D.width+' × '+D.height:'视频预览';if(D.poster)video.poster=D.poster;load()}else{showStatus('模板预览');play.textContent='未绑定视频';$('#empty-note').textContent='这是可复用的调音模板。生成项目试听页后，即可在这里播放视频。';$('#hint').textContent='模板已就绪，生成项目时自动填入视频和音轨。';$('#compare').disabled=true;$('#copy').disabled=true}
changeGain();drawWave();tick();
</script></body></html>
