<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>视频场景</title>
<style>
:root{--paper:#f7f7f5;--ink:#141414;--accent:#002fa7;--line:#c7c7c2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",sans-serif}
main{position:absolute;inset:0;padding:7% 7% 16%;display:grid;grid-template-columns:1.2fr 1fr;gap:6%;align-items:center}
small{font:500 22px Consolas,monospace;letter-spacing:.12em;color:var(--accent)}
h1{font-size:clamp(44px,6vw,116px);font-weight:300;letter-spacing:-.04em;line-height:1.16;margin:30px 0}
p{font-size:clamp(24px,2.6vw,50px);line-height:1.6;margin:0}
.evidence{border-top:2px solid var(--ink);padding-top:28px}.index{font:300 clamp(100px,17vw,326px)/1 sans-serif;color:var(--accent)}
.line{height:3px;background:var(--accent);transform-origin:left;margin-top:30px}
</style>
<main><section data-safe-check><small>STORY / EVIDENCE</small><h1>先理解材料<br>再组织画面</h1><p>用画面呈现证据，<br>用讲解连接它们。</p></section><section class="evidence" data-safe-check><div class="index">01</div><p>为当前材料重新设计此区域</p><div class="line"></div></section></main>
<script>
// All motion must be a pure function of local audio time. No wall clock animation.
window.renderAt=function(t,duration){
 const p=Math.min(1,Math.max(0,t/.5)), eased=1-Math.pow(1-p,3);
 document.querySelector('main').style.opacity=String(eased);
 document.querySelector('main').style.transform=`translateY(${(1-eased)*18}px)`;
 document.querySelector('.line').style.transform=`scaleX(${Math.min(1,t/1.3)})`;
 // productionBeats is supplied by both preview and export, with real word times.
};window.renderAt(1,5);
</script></html>
