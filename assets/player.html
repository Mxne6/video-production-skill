<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>视频审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ededeb;color:#171717;font:15px/1.5 "Microsoft YaHei",sans-serif}header{padding:18px 28px;display:flex;justify-content:space-between;border-bottom:1px solid #b6b6b2}h1{font-weight:400;font-size:20px;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:24px}.viewport{position:relative;overflow:hidden;background:#111;width:100%;aspect-ratio:16/9}#stage{position:absolute;top:0;left:0;transform-origin:0 0}iframe{position:absolute;border:0;width:100%;height:100%;visibility:hidden}iframe.active{visibility:visible}#mark{position:absolute;right:16px;top:12px;font:18px sans-serif;color:white;background:#222;padding:8px;z-index:11}audio{width:100%;margin-top:18px}.controls{display:flex;gap:12px;margin:16px 0;align-items:center}button,input,select,textarea{font:inherit;border:1px solid #aaa;background:#fafaf8;padding:8px;color:#111}button{cursor:pointer}button:hover{background:#ddd}button:disabled{opacity:.4;cursor:default}textarea{width:100%;min-height:70px}#cues{max-height:58vh;overflow:auto}article{border-top:1px solid #bbb;padding:12px 0;cursor:pointer}article.active{color:#002fa7}article[data-status=pass]::before{content:'✓ ';color:#125b2a}article[data-status=issue]::before{content:'! ';color:#a32310}.muted{color:#666;font-size:13px}#error{color:#a32310}a{color:#002fa7}@media(max-width:850px){.layout{grid-template-columns:1fr}#cues{max-height:30vh}}
</style><header><h1>画面与声音审核</h1><span id="summary"></span></header>
<div class="layout"><section><div class="viewport"><div id="stage"><div id="mark"></div></div></div><audio id="audio" controls></audio><div class="controls"><button id="previous">上一句</button><button id="loop">循环当前句</button><button id="next">下一句</button><label>速度 <select id="speed"><option>.75</option><option selected>1</option><option>1.25</option></select></label><span id="clock"></span></div><p id="error"></p><p class="muted">逐句试听检查：文字是否单行、断句是否自然、出现与消失是否同步、是否挡住关键画面。审核结果不会修改字幕。</p></section>
<aside><p>审核人 <input id="reviewer" placeholder="姓名或审核标识"></p><label><input id="listened" type="checkbox">已实际试听当前音轨</label><div class="controls"><button id="pass">本句通过</button><button id="issue">标记问题</button></div><textarea id="note" placeholder="过早、过晚、断句、遮挡、读音等具体问题"></textarea><div class="controls"><button id="export">导出审核记录</button></div><div id="cues"></div></aside></div>
<script>
const D=/*PROJECT_DATA*/;
const audio=document.querySelector('#audio'),stage=document.querySelector('#stage'),rows=document.querySelector('#cues');
const storage='vp-review-'+D.identity;let saved={};try{saved=JSON.parse(localStorage.getItem(storage)||'{}')}catch{}
let marks={...D.initial_marks,...saved.cues},selected=0,looping=false,current=-1,ready=new Set();
stage.style.width=D.profile.width+'px';stage.style.height=D.profile.height+'px';
document.querySelector('.viewport').style.aspectRatio=D.profile.width+'/'+D.profile.height;
document.querySelector('#mark').textContent=D.test_mode?'测试音轨 · 非正式旁白':'';if(!D.test_mode)document.querySelector('#mark').hidden=true;
// Buffer the WAV as a Blob so seeking also works on Python's simple local server,
// which does not implement HTTP byte ranges consistently across Python versions.
fetch(D.bundle.audio).then(r=>{if(!r.ok)throw Error('音轨加载失败');return r.blob()}).then(b=>{audio.src=URL.createObjectURL(b)}).catch(e=>document.querySelector('#error').textContent=e.message);
document.querySelector('#summary').textContent=D.bundle.duration.toFixed(2)+' 秒 · '+D.cues.length+' 句';
document.querySelector('#reviewer').value=saved.reviewer||'';
const frames=D.bundle.timeline.map((s,i)=>{let frame=document.createElement('iframe');frame.src=s.html;frame.title=s.id;stage.prepend(frame);frame.addEventListener('load',async()=>{try{const win=frame.contentWindow,doc=frame.contentDocument;if(typeof win.renderAt!=='function')throw Error('缺少 renderAt');await doc.fonts.ready;await Promise.all([...doc.images].map(image=>image.decode()));const style=doc.createElement('style');style.textContent='*{animation:none!important;transition:none!important}html,body{margin:0!important;padding:0!important;overflow:hidden!important}'+D.caption_css;doc.head.append(style);const caption=doc.createElement('div');caption.id='vp-caption';caption.innerHTML='<span></span>';doc.body.append(caption);ready.add(i);tick()}catch(e){document.querySelector('#error').textContent='场景加载失败，请从本地 HTTP 服务打开审核页：'+e.message}});return frame});
new ResizeObserver(()=>{stage.style.transform=`scale(${document.querySelector('.viewport').clientWidth/D.profile.width})`}).observe(document.querySelector('.viewport'));
function persist(){try{localStorage.setItem(storage,JSON.stringify({identity:D.identity,cues:marks,reviewer:document.querySelector('#reviewer').value}))}catch{}}
function paint(){rows.innerHTML='';D.cues.forEach((c,i)=>{const el=document.createElement('article');el.dataset.status=marks[c.id]?.status||'';el.classList.toggle('active',i===selected);el.textContent=`${i+1}. ${c.text}`;el.title=`${c.start.toFixed(2)}–${c.end.toFixed(2)}s`;el.onclick=()=>seek(i);rows.append(el)})}
function seek(i){if(!D.cues.length)return;selected=Math.max(0,Math.min(D.cues.length-1,i));audio.currentTime=Math.max(0,D.cues[selected].start-.15);document.querySelector('#note').value=marks[D.cues[selected].id]?.note||'';paint();tick()}
let rendering=false;
async function tick(){if(rendering)return;rendering=true;try{let t=audio.currentTime;let i=D.bundle.timeline.findIndex(s=>s.start<=t&&t<s.start+s.duration);if(i<0)i=D.bundle.timeline.length-1;if(i!==current){frames.forEach((f,j)=>f.classList.toggle('active',i===j));current=i}if(ready.has(i)){const s=D.bundle.timeline[i],win=frames[i].contentWindow;win.productionBeats=s.beats;await win.renderAt(t-s.start,s.duration);const cue=D.cues.find(c=>c.start<=t&&t<c.end),cap=win.document.querySelector('#vp-caption span');cap.textContent=cue?.text||'';cap.style.visibility=cue?'visible':'hidden'}document.querySelector('#clock').textContent=t.toFixed(2)+'s';if(looping&&D.cues[selected]&&t>D.cues[selected].end+.25)audio.currentTime=Math.max(0,D.cues[selected].start-.15)}catch(e){document.querySelector('#error').textContent=e.message}finally{rendering=false}}
function animate(){tick();requestAnimationFrame(animate)}
document.querySelector('#previous').onclick=()=>seek(selected-1);document.querySelector('#next').onclick=()=>seek(selected+1);
document.querySelector('#loop').onclick=()=>{looping=!looping;document.querySelector('#loop').textContent=looping?'停止循环':'循环当前句';if(looping){seek(selected);audio.play()}};
document.querySelector('#speed').onchange=e=>audio.playbackRate=Number(e.target.value);
for(const status of ['pass','issue'])document.querySelector('#'+status).onclick=()=>{if(!D.cues[selected])return;marks[D.cues[selected].id]={status,note:document.querySelector('#note').value};persist();paint()};
document.querySelector('#export').onclick=()=>{const report={identity:D.identity,cue_keys:D.cue_keys,reviewer:document.querySelector('#reviewer').value,listened:document.querySelector('#listened').checked,cues:marks};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='caption-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
paint();animate();
</script></html>
