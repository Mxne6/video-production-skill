<!doctype html>
<html lang="{{LANG}}" data-mode="{{STYLE}}" {{VISUAL_ATTRIBUTE}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adaptive video scene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="video-template.css">
</head>
<body>
  <!-- Starter only. Read project.json scenes[].design before changing this markup.
       Delete data-starter-only once the composition genuinely reflects the scene brief. -->
  <main class="scene adaptive scene-plain" data-scene data-starter-only="true">
    <div class="scene-frame scene-stack scene-gap-lg" data-safe-check>
      <p class="eyebrow" data-reveal>Scene brief first</p>
      <h1 class="type-statement" data-reveal data-delay="0.08">Redesign this composition around the dominant information.</h1>
      <p class="lede" data-reveal data-delay="0.22">This seed intentionally avoids a fixed image slot, rail, metric grid, or footer.</p>
    </div>
  </main>
  <script src="video-template.js"></script>
</body>
</html>
