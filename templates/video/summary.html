<!doctype html>
<html lang="{{LANG}}" data-mode="{{STYLE}}" {{VISUAL_ATTRIBUTE}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summary scene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="video-template.css">
</head>
<body>
  <main class="scene summary" data-scene>
    <header class="rail">
      <span>Summary</span>
      <span>06</span>
    </header>
    <div class="summary-shell">
      <section class="summary-center" data-safe-check>
        <p class="eyebrow" data-reveal>Conclusion</p>
        <h1 data-reveal data-delay="0.08">Return to the promise. <em>Make the next step clear.</em></h1>
      </section>
      <section class="summary-points" data-safe-check>
        <p data-reveal data-delay="0.34"><b>01</b>Benefit</p>
        <p data-reveal data-delay="0.44"><b>02</b>Proof</p>
        <p data-reveal data-delay="0.54"><b>03</b>Next step</p>
      </section>
      <div class="rule"></div>
    </div>
  </main>
  <script src="video-template.js"></script>
</body>
</html>
