<!doctype html>
<html lang="{{LANG}}" data-mode="{{STYLE}}" {{VISUAL_ATTRIBUTE}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening scene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="video-template.css">
</head>
<body>
  <main class="scene opening" data-scene>
    <header class="rail">
      <span>Opening</span>
      <span>01</span>
    </header>
    <div class="opening-shell">
      <section class="opening-copy" data-safe-check>
        <p class="eyebrow" data-reveal>Product category</p>
        <h1 data-reveal data-delay="0.08">Replace with one clear promise.<strong>Prove it once.</strong></h1>
        <p class="lede" data-reveal data-delay="0.28">Add one supporting sentence.</p>
      </section>
      <aside class="opening-aside" data-safe-check>
        <span class="opening-number" data-reveal data-delay="0.12">01</span>
      </aside>
    </div>
  </main>
  <script src="video-template.js"></script>
</body>
</html>
