<!doctype html>
<html lang="{{LANG}}" data-mode="{{STYLE}}" {{VISUAL_ATTRIBUTE}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product hero scene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="video-template.css">
</head>
<body>
  <main class="scene product" data-scene>
    <header class="rail">
      <span>Product</span>
      <span>02</span>
    </header>
    <div class="product-shell">
      <section class="product-copy" data-safe-check>
        <p class="eyebrow" data-reveal>Product name / grade</p>
        <h1 data-reveal data-delay="0.08">Show the product as the subject.</h1>
        <ul class="feature-list">
          <li data-reveal data-delay="0.24"><b>01</b><span>Defining attribute.</span></li>
          <li data-reveal data-delay="0.34"><b>02</b><span>Practical benefit.</span></li>
        </ul>
      </section>
      <figure class="product-stage" data-safe-check>
        <span class="stage-index" data-reveal data-delay="0.14">PRODUCT / 01</span>
        <div class="media-placeholder" data-asset-slot="product-hero">Product image.</div>
      </figure>
    </div>
  </main>
  <script src="video-template.js"></script>
</body>
</html>
